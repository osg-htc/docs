site_name: OSG Site Documentation
site_url: https://osg-htc.org/docs/
repo_url: https://github.com/osg-htc/docs/
extra:
  analytics:
    provider: google
    property: UA-69012-29
theme:
  name: material
  variant: modern
  custom_dir: osgthedocs
  favicon: 'img/favicon.ico'
  features:
    - navigation.sections
    - navigation.top

extra_css:
  - css/extra.css

nav:
- Home: 'index.md'
- Site Planning: 'site-planning.md'
- Site Verification: 'site-verification.md'
- Site Maintenance: 'site-maintenance.md'
- 'Help / Security Incidents': 'common/help.md'
- Registration:
  - Contact Information: 'common/contact-registration.md'
  - Resources and Collaborations: 'common/registration.md'
- Resource Sharing:
  - Compute:
    - 'Overview': 'resource-sharing/overview.md'
    - Containers:
      - 'OSPool Containers': 'resource-sharing/os-backfill-containers.md'
      - 'User Allocations': 'resource-sharing/user-containers.md'
    - Compute Entrypoint:
      - 'HTCondor-CE Overview': 'compute-element/htcondor-ce-overview.md'
      - 'Request a Hosted CE': 'compute-element/hosted-ce.md'
      - 'Install HTCondor-CE': 'compute-element/install-htcondor-ce.md'
    - Worker Node:
        - 'Overview': 'worker-node/using-wn.md'
        - 'Install from RPM': 'worker-node/install-wn.md'
        - 'Install from Tarball': 'worker-node/install-wn-tarball.md'
        - 'Install from OASIS': 'worker-node/install-wn-oasis.md'
        - 'Install CVMFS': 'worker-node/install-cvmfs.md'
        - 'Install Apptainer': 'worker-node/install-apptainer.md'
        - 'Using WN Containers': 'worker-node/using-wn-containers.md'
  - Data:
    - HTTP & OASIS:
      - 'Running Frontier Squid in a Container': 'data/run-frontier-squid-container.md'
      - 'Install Frontier Squid RPM': 'data/frontier-squid.md'
      - 'Update OASIS Shared Repo': 'data/update-oasis.md'
      - 'Install an OASIS Repo': 'data/external-oasis-repos.md'
    - XRootD:
      - 'XRootD Overview': 'data/xrootd/overview.md'
      - 'Install XRootD Standalone': 'data/xrootd/install-standalone.md'
      - 'Configure Authorization': 'data/xrootd/xrootd-authorization.md'
      - 'Using XRootD': 'data/xrootd/install-client.md'
      - 'Install CMS XCache': 'data/xrootd/install-cms-xcache.md'
      - 'Install XRootD Shoveler': 'data/xrootd/install-shoveler.md'
  - Other:
    - 'Install GlideinWMS Frontend': 'other/install-gwms-frontend.md'
    - 'Install a CVMFS Stratum 1': 'other/install-cvmfs-stratum1.md'
    - 'Troubleshooting Gratia': 'other/troubleshooting-gratia.md'
    - 'Install Transfer Log Filebeats': 'other/schedd-filebeats.md'
    - 'Install OSG Token Renewal Service': 'other/osg-token-renewer.md'
- Access Point:
  - 'Install an OSPool Access Point': 'submit/install-ospool-ap.md'
  - 'Acceptable Use Policy': 'submit/ap-ospool-aup.md'
- 'Data Federation (OSDF)':
  - 'Overview': 'data/osdf/overview.md'
  - Data Cache:
      - 'Install from container': 'data/osdf/install-cache-container.md'
      - 'Install from RPM': 'data/osdf/install-cache-rpm.md'
  - Data Origin:
      - 'Install from container': 'data/osdf/install-origin-container.md'
      - 'Install from RPM': 'data/osdf/install-origin-rpm.md'
- Releases:
  - 'Release Series': 'release/release_series.md'
  - OSG 25:
     - 'News': 'release/osg-25.md'
     - 'Updating to OSG 25': 'release/updating-to-osg-25.md'
  - OSG 24:
     - 'News': 'release/osg-24.md'
     - 'Updating to OSG 24': 'release/updating-to-osg-24.md'
  - 'Supported Platforms': 'release/supported_platforms.md'
  - 'OSG Yum Repos': 'common/yum.md'
  - 'Yum Basics': 'release/yum-basics.md'
  - 'RPM Signing': 'release/signing.md'
- Tokens:
  - Overview: 'security/tokens/overview.md'
  - Using Tokens: 'security/tokens/using-tokens.md'
- CA Certificates:
  - 'Overview': 'common/ca.md'
  - 'Certificate Management Reference': 'security/certificate-management.md'
  - 'Host Certificates':
    - 'Overview': 'security/host-certs/overview.md'
    - 'Using InCommon': 'security/host-certs/incommon.md'
    - "Using Let's Encrypt": 'security/host-certs/lets-encrypt.md'

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: False
  - meta
  - toc:
      permalink: True
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        Documentation for system administrators contributing computational and storage
        capacity to the OSG Consortium: installing and operating HTCondor-CEs, worker nodes,
        OSDF caches and origins, access points, and related OSG software.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - index.md
          - site-planning.md
          - site-verification.md
          - site-maintenance.md
          - common/help.md
        Registration:
          - common/contact-registration.md
          - common/registration.md
        Compute:
          - resource-sharing/overview.md: Overview of contributing compute capacity to the OSG
          - resource-sharing/os-backfill-containers.md
          - resource-sharing/user-containers.md
          - compute-element/htcondor-ce-overview.md
          - compute-element/hosted-ce.md
          - compute-element/install-htcondor-ce.md
          - worker-node/using-wn.md: Overview of OSG worker node client options
          - worker-node/install-wn.md: Install the OSG worker node client from RPM
          - worker-node/install-wn-tarball.md
          - worker-node/install-wn-oasis.md
          - worker-node/install-cvmfs.md
          - worker-node/install-apptainer.md
          - worker-node/using-wn-containers.md
        Data:
          - data/run-frontier-squid-container.md
          - data/frontier-squid.md
          - data/update-oasis.md
          - data/external-oasis-repos.md
          - data/xrootd/overview.md
          - data/xrootd/install-standalone.md
          - data/xrootd/xrootd-authorization.md
          - data/xrootd/install-client.md
          - data/xrootd/install-cms-xcache.md
          - data/xrootd/install-shoveler.md
        Other Services:
          - other/install-gwms-frontend.md
          - other/install-cvmfs-stratum1.md
          - other/troubleshooting-gratia.md
          - other/schedd-filebeats.md
          - other/osg-token-renewer.md
        Access Point:
          - submit/install-ospool-ap.md
          - submit/ap-ospool-aup.md
        Data Federation (OSDF):
          - data/osdf/overview.md: Overview of the Open Science Data Federation (OSDF)
          - data/osdf/install-cache-container.md: Install an OSDF cache from a container
          - data/osdf/install-cache-rpm.md: Install an OSDF cache from RPM
          - data/osdf/install-origin-container.md: Install an OSDF origin from a container
          - data/osdf/install-origin-rpm.md: Install an OSDF origin from RPM
        Releases:
          - release/release_series.md
          - release/osg-25.md: OSG 25 release series news
          - release/updating-to-osg-25.md
          - release/osg-24.md: OSG 24 release series news
          - release/updating-to-osg-24.md
          - release/supported_platforms.md
          - common/yum.md
          - release/yum-basics.md
          - release/signing.md
        Security:
          - security/tokens/overview.md: Overview of bearer tokens in the OSG
          - security/tokens/using-tokens.md
          - common/ca.md: Overview of CA certificates in the OSG
          - security/certificate-management.md
          - security/host-certs/overview.md: Overview of obtaining host certificates
          - security/host-certs/incommon.md
          - security/host-certs/lets-encrypt.md
  - redirects:
      redirect_maps:
        site-responsibilities.md: site-maintenance.md
        data/stashcache/overview.md: data/osdf/overview.md
        data/stashcache/install-cache.md: data/osdf/install-cache-container.md
        data/stashcache/install-origin.md: data/osdf/install-origin-container.md
        data/stashcache/run-stashcache-container.md: data/osdf/install-cache-container.md
        data/stashcache/run-stash-origin-container.md: data/osdf/install-origin-container.md
        data/stashcache/vo-data.md: data/osdf/overview.md
        submit/osg-flock.md: submit/install-ospool-ap.md
        other/configuration-with-osg-configure.md: 'https://github.com/opensciencegrid/osg-configure?tab=readme-ov-file#osg-configure'

